name: PocketShare CI

on:
  push:
    branches: [main, master, develop]
    # Without a tags filter, GitHub skips tag pushes for this workflow entirely.
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, detekt, ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the removed `tools` package, which
          # makes sdkmanager exit 1 on current runner images. Install only what the build needs.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: ktlint check
        run: ./gradlew ktlintCheck
        shell: bash

      - name: detekt check
        run: ./gradlew detekt
        shell: bash

      - name: lint check
        run: ./gradlew :app:lint
        shell: bash

      - name: Save lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the removed `tools` package, which
          # makes sdkmanager exit 1 on current runner images. Install only what the build needs.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Tests only. Debug APKs are deliberately not assembled here: the release job builds and
      # verifies the signed APK, and skipping the extra debug package keeps CI time and artifact
      # storage small.
      - name: Unit + integration tests
        run: ./gradlew :core:test :server:test :app:testDebugUnitTest :tunnel:test
        shell: bash

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, build-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the removed `tools` package, which
          # makes sdkmanager exit 1 on current runner images. Install only what the build needs.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # versionCode must grow with every published version. GITHUB_RUN_NUMBER does not: it counts
      # workflow runs, so a new release could land below the previous versionCode and be rejected
      # as a downgrade. Derive it from the tag instead (v1.1.1 -> 10101).
      - name: Parse version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if ! [[ "${major}" =~ ^[0-9]+$ && "${minor}" =~ ^[0-9]+$ && "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version_code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          echo "POCKETSHARE_VERSION_NAME=${version}" >> "${GITHUB_ENV}"
          echo "POCKETSHARE_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"
          echo "Release ${version} with versionCode ${version_code}"

      - name: Decode signing keystore
        run: |
          umask 077
          printf '%s' "${{ secrets.POCKETSHARE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/pocketshare.jks"
          echo "POCKETSHARE_KEYSTORE=$RUNNER_TEMP/pocketshare.jks" >> "$GITHUB_ENV"
        shell: bash

      - name: Release build
        run: ./gradlew assembleRelease bundleRelease
        env:
          POCKETSHARE_KEYSTORE_PASSWORD: ${{ secrets.POCKETSHARE_KEYSTORE_PASSWORD }}
          POCKETSHARE_KEY_ALIAS: ${{ secrets.POCKETSHARE_KEY_ALIAS }}
          POCKETSHARE_KEY_PASSWORD: ${{ secrets.POCKETSHARE_KEY_PASSWORD }}
        shell: bash

      - name: Verify release signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
        shell: bash

      - name: Verify APK contains cloudflared
        run: |
          set -o pipefail
          unzip -l app/build/outputs/apk/release/app-release.apk | grep libcloudflared
        shell: bash

      # Each release would otherwise leave its APK/AAB in Actions storage forever. Drop artifacts
      # from earlier runs (any workflow) so the repository stays far below the storage quota.
      - name: Delete older workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          while read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            gh api --method DELETE "repos/${repo}/actions/artifacts/${artifact_id}" >/dev/null || true
          done < <(
            gh api --paginate "repos/${repo}/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id"
          )
        shell: bash

      # Gradle writes app-release.apk / app-release.aab. The previous globs asked for
      # app-release-*.apk and *.aab, matched nothing, and v1.1.1 shipped with zero downloads.
      # Assets are renamed with the version and attached to the release itself instead of being
      # uploaded as workflow artifacts, so they do not consume Actions storage.
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/PocketShare-${POCKETSHARE_VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/PocketShare-${POCKETSHARE_VERSION_NAME}.aab"
          ls -lh release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
