name: PocketShare CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Release version code"
        required: false
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, detekt, ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: ktlint check
        run: ./gradlew ktlintCheck
        shell: bash

      - name: detekt check
        run: ./gradlew detekt
        shell: bash

      - name: lint check
        run: ./gradlew :app:lint
        shell: bash

      - name: Save lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit + integration tests
        run: ./gradlew :core:test :server:test :app:testDebugUnitTest :tunnel:test
        shell: bash

      - name: Assemble debug
        run: ./gradlew assembleDebug --continue
        shell: bash

      - name: Verify APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libcloudflared

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, build-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version from tag
        run: |
          echo "POCKETSHARE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "POCKETSHARE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Decode signing keystore
        run: |
          umask 077
          printf '%s' "${{ secrets.POCKETSHARE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/pocketshare.jks"
          echo "POCKETSHARE_KEYSTORE=$RUNNER_TEMP/pocketshare.jks" >> "$GITHUB_ENV"
        shell: bash

      - name: Release build
        run: ./gradlew assembleRelease bundleRelease
        env:
          POCKETSHARE_KEYSTORE_PASSWORD: ${{ secrets.POCKETSHARE_KEYSTORE_PASSWORD }}
          POCKETSHARE_KEY_ALIAS: ${{ secrets.POCKETSHARE_KEY_ALIAS }}
          POCKETSHARE_KEY_PASSWORD: ${{ secrets.POCKETSHARE_KEY_PASSWORD }}
        shell: bash

      - name: Verify release signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketshare-release-apk
          path: app/build/outputs/apk/release/app-release-*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pocketshare-release-aab
          path: app/build/outputs/bundle/release/app-release-*.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          generate_release_notes: true
