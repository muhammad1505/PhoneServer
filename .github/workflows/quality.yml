name: Lint + detekt + ktlint (daily)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  report:
    name: Quality report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download pinned cloudflared for build
        run: ./scripts/fetch-cloudflared.sh

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint + detekt + lint
        run: |
          ./gradlew ktlintCheck detekt :app:lint
        env:
          CI: "true"
